<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTALKontroll — Min side</title>
<script src="tk-nav.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F5F7;color:#1B2A4A;min-height:100vh}
  .topbar{background:#fff;border-bottom:1px solid #E2E6EC;padding:0 32px;height:52px;display:flex;align-items:center;position:sticky;top:0;z-index:50}
  .topbar-breadcrumb{font-size:13px;color:#9BA5B5;font-weight:500}.topbar-breadcrumb .current{color:#1B2A4A;font-weight:600}
  .content{padding:28px 32px;max-width:900px}
  .empty{text-align:center;padding:80px 20px}
  .empty-icon{font-size:56px;opacity:.3;margin-bottom:16px}
  .empty-title{font-size:20px;font-weight:700;color:#1B2A4A;margin-bottom:8px}
  .empty-desc{font-size:14px;color:#9BA5B5;line-height:1.6;max-width:400px;margin:0 auto}
</style>
</head>
<body>
  <div class="topbar"><div class="topbar-breadcrumb">TOTALKontroll / <span class="current">Min side</span></div></div>
  <div class="content">
    <div class="empty">
      <div class="empty-icon">🏠</div>
      <div class="empty-title">Min side</div>
      <div class="empty-desc">Personlig dashboard med varsler, oppgaver og snarveier. Kommer i en fremtidig leveranse.</div>
    </div>
  </div>
</body>
</html>
